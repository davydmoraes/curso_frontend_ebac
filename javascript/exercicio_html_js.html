<html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <title>Meu Formulário</title>
    <link rel="stylesheet" href="./exercicio_html_js.css" />
    </head>
    
    <body>
        <form id="numbersForm">
            <label for="campoA">Campo A:</label>
            <input type="number" name="campoA" id="campoA">
            <label for="campoB">Campo B:</label>
            <input type="number" name="campoB" id="campoB">
            <p id="error-message">O valor de A deve ser menor que o valor de B!</p>
            <p id="success-message">Os valores foram inseridos corretamente!</p>
            <button type="submit">Submeter</button>
        </form>
        <script src="./exercicio_html_js.js"></script>
    </body>
</html>
